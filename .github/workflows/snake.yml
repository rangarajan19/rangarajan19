name: contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Palette matches assets/header.svg: amber snake, mint contribution cells.
          outputs: |
            dist/snake-light.svg?color_snake=%239A5C0E&color_dots=%23EAEFF1,%23B9E3D2,%238ACDB3,%2347A286,%230F7355
            dist/snake-dark.svg?color_snake=%23F2A63B&color_dots=%231A232A,%23214C3F,%232C7A61,%233CA982,%234FD1A5

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
