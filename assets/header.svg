<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352" role="img" aria-label="Rangarajan G, agentic AI engineer in Chennai. An agent trace showing a plan step, an MCP tool call, a retrieval, a guardrail blocking a disallowed file write, and a passing validation. The LLM steers, deterministic code decides.">
<defs>
  <style>
    svg{--bg:#FFFFFF;--rule:#D5DDE1;--grid:#EFF3F5;--tx:#15212A;--dim:#5B6A72;--amber:#9A5C0E;--mint:#0F7355;--coral:#AE3A20}
    @media (prefers-color-scheme: dark){
      svg{--bg:#121A1F;--rule:#27323A;--grid:#1A232A;--tx:#DDE5E9;--dim:#78878F;--amber:#F2A63B;--mint:#4FD1A5;--coral:#EA7358}
    }
    .mono{font-family:ui-monospace,SFMono-Regular,"Cascadia Mono","Segoe UI Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .panel{fill:var(--bg);stroke:var(--rule);stroke-width:1}
    .gl{stroke:var(--grid);stroke-width:1;fill:none}
    .hr{stroke:var(--rule);stroke-width:1}
    .tx{fill:var(--tx)} .dm{fill:var(--dim)} .am{fill:var(--amber)} .mn{fill:var(--mint)} .co{fill:var(--coral)}

    .name{font-size:46px;font-weight:700;fill:var(--tx)}
    .sub{font-size:13.5px;font-weight:500}
    .meta{font-size:12.5px}
    .kind{font-size:12px;letter-spacing:.6px}
    .body{font-size:14px}
    .lat{font-size:12px}
    .stat{font-size:12.5px;font-weight:600;letter-spacing:.4px}
    .res{font-size:15.5px;font-weight:600}

    /* One orchestrated page-load sequence. fill-mode backwards means the
       resting state is the finished state, so killing motion loses nothing. */
    #typeclip rect{animation:type .95s steps(12,end) .15s backwards}
    @keyframes type{from{width:0}to{width:372px}}

    .caret{fill:var(--amber);opacity:0;
      animation:caretrun .95s steps(12,end) .15s,caretblink .62s steps(1,end) 1.1s 3,caretgone .25s linear 2.96s backwards}
    @keyframes caretrun{from{transform:translateX(0);opacity:.95}to{transform:translateX(372px);opacity:.95}}
    @keyframes caretblink{0%{opacity:.95;transform:translateX(372px)}50%{opacity:0;transform:translateX(372px)}100%{opacity:.95;transform:translateX(372px)}}
    @keyframes caretgone{from{opacity:.95;transform:translateX(372px)}to{opacity:0;transform:translateX(372px)}}

    .sub{animation:rise .5s cubic-bezier(.2,.7,.2,1) 1.15s backwards}
    @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

    .row{animation:rowin .42s cubic-bezier(.2,.7,.2,1) var(--d) backwards}
    @keyframes rowin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}

    .row .lat{animation:fade .3s linear calc(var(--d) + .2s) backwards}
    @keyframes fade{from{opacity:0}to{opacity:1}}

    .row .stat{transform-box:fill-box;transform-origin:100% 50%;
      animation:stamp .34s cubic-bezier(.2,1.5,.4,1) calc(var(--d) + .3s) backwards}
    @keyframes stamp{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}

    .alarm{animation:alarm .8s ease-in-out 2.78s 2 backwards}
    @keyframes alarm{0%,100%{opacity:1}50%{opacity:.22}}

    .result{animation:rise .55s cubic-bezier(.2,.7,.2,1) 3.5s backwards}
    .tick{fill:none;stroke:var(--mint);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
      stroke-dasharray:26;animation:draw .45s ease-out 3.8s backwards}
    @keyframes draw{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}

    .sweep{opacity:0;animation:sweep 1.15s cubic-bezier(.4,0,.6,1) .05s backwards}
    @keyframes sweep{0%{opacity:0;transform:translateY(0)}18%{opacity:1}100%{opacity:0;transform:translateY(312px)}}

    /* The only loop in the piece. */
    .pip{animation:pip 2.4s ease-in-out infinite}
    @keyframes pip{0%,100%{opacity:1}50%{opacity:.4}}
    .halo{fill:none;stroke:var(--mint);stroke-width:1.2;opacity:0;animation:halo 2.4s ease-out infinite}
    @keyframes halo{0%{r:3.4px;opacity:.65}70%{r:10px;opacity:0}100%{r:10px;opacity:0}}

    @media (prefers-reduced-motion: reduce){
      *{animation:none !important}
      .caret,.sweep{opacity:0 !important}
    }
  </style>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path class="gl" d="M30 0V30M0 30H30"/>
  </pattern>
  <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="var(--amber)" stop-opacity="0"/>
    <stop offset=".5" stop-color="var(--amber)" stop-opacity=".55"/>
    <stop offset="1" stop-color="var(--amber)" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="box"><rect x="1" y="1" width="898" height="350" rx="14"/></clipPath>
  <clipPath id="typeclip"><rect x="28" y="58" width="372" height="60"/></clipPath>
</defs>

<rect x=".5" y=".5" width="899" height="351" rx="14" class="panel"/>
<g clip-path="url(#box)">
  <rect width="900" height="352" fill="url(#grid)"/>
  <rect class="sweep" x="1" y="38" width="898" height="2" fill="url(#scan)"/>

  <text class="mono meta" x="28" y="25"><tspan class="am">agent://</tspan><tspan class="dm">rangarajan19</tspan></text>
  <circle class="halo" cx="824" cy="20" r="3.4"/>
  <circle class="pip mn" cx="824" cy="20" r="3.4"/>
  <text class="mono meta mn" x="872" y="24.5" text-anchor="end" style="letter-spacing:1px">live</text>
  <path class="hr" d="M1 38.5H899"/>

  <g clip-path="url(#typeclip)">
    <text class="mono name" x="28" y="104" textLength="372" lengthAdjust="spacing">RANGARAJAN G</text>
  </g>
  <rect class="caret" x="28" y="110" width="22" height="4" rx="1"/>
  <text class="mono sub" x="28" y="136"><tspan class="am">agentic ai engineer</tspan><tspan class="dm">, chennai — i build agents and the tooling that keeps them honest</tspan></text>
  <path class="hr" d="M1 158.5H899"/>

  <g class="row" style="--d:1.55s">
    <rect class="dm" x="28" y="181" width="6" height="6" rx="1"/>
    <text class="mono kind dm" x="46" y="190">plan</text>
    <text class="mono body tx" x="134" y="190">decompose story into 4 subtasks</text>
    <text class="mono lat dm" x="782" y="190" text-anchor="end">0.3s</text>
    <text class="mono stat mn" x="872" y="190" text-anchor="end">ok</text>
  </g>
  <g class="row" style="--d:1.9s">
    <rect class="am" x="28" y="205" width="6" height="6" rx="1"/>
    <text class="mono kind dm" x="46" y="214">tool</text>
    <text class="mono body tx" x="134" y="214">mcp.jira.fetch_context(issue=PLM-4471)</text>
    <text class="mono lat dm" x="782" y="214" text-anchor="end">0.8s</text>
    <text class="mono stat mn" x="872" y="214" text-anchor="end">ok</text>
  </g>
  <g class="row" style="--d:2.25s">
    <rect class="am" x="28" y="229" width="6" height="6" rx="1"/>
    <text class="mono kind dm" x="46" y="238">retrieve</text>
    <text class="mono body tx" x="134" y="238">rag.search(k=6, grounded=true)</text>
    <text class="mono lat dm" x="782" y="238" text-anchor="end">1.2s</text>
    <text class="mono stat mn" x="872" y="238" text-anchor="end">ok</text>
  </g>
  <g class="row" style="--d:2.6s">
    <rect class="co alarm" x="28" y="253" width="6" height="6" rx="1"/>
    <text class="mono kind dm" x="46" y="262">guard</text>
    <text class="mono body tx" x="134" y="262">write_file("/etc/hosts") not in allow-list</text>
    <text class="mono lat dm" x="782" y="262" text-anchor="end">0.0s</text>
    <text class="mono stat co" x="872" y="262" text-anchor="end">blocked</text>
  </g>
  <g class="row" style="--d:2.95s">
    <rect class="mn" x="28" y="277" width="6" height="6" rx="1"/>
    <text class="mono kind dm" x="46" y="286">verify</text>
    <text class="mono body tx" x="134" y="286">output schema + coverage assertions</text>
    <text class="mono lat dm" x="782" y="286" text-anchor="end">0.4s</text>
    <text class="mono stat mn" x="872" y="286" text-anchor="end">passed</text>
  </g>
  <path class="hr" d="M1 302.5H899"/>

  <g class="result">
    <path class="tick" d="M29 327l5.4 5.6L46 320"/>
    <text class="mono res" x="60" y="332"><tspan class="am">llm steers.</tspan><tspan class="tx"> deterministic code decides.</tspan></text>
  </g>
</g>
</svg>
